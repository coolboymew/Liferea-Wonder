#!/hint/bash
# makepkg settings for packages that are shared (e.g. GitHub releases):
# the system's settings, but code for any x86-64 processor. Distributions
# like CachyOS build with -march=native -O3, which ties a package to the
# processor of the computer that built it ("Illegal instruction" on
# others). These are Arch Linux's defaults.
#
#   makepkg --config release-makepkg.conf -f

source /etc/makepkg.conf

CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection \
        -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LTOFLAGS="-flto=auto"
